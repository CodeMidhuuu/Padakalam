<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Padakkalam | Malayalam Riddle Game</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =====================================================
     NAVBAR
===================================================== -->

    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"> 🧠 PADAKKALAM </a>

        <span class="score-badge"> Score: <span id="score">0</span> </span>
      </div>
    </nav>

    <!-- =====================================================
     MAIN GAME AREA
===================================================== -->

    <main class="container game-container">
      <!-- Header -->

      <div class="text-center mb-4">
        <div class="game-tag">⚔️ RIDDLE BATTLE</div>

        <h1>
          Buddhi undenkil<br />
          <span>jayikkada.</span>
        </h1>

        <p class="subtitle">3 chances. 2 clues. Pinne nanakkedu. 💀</p>
      </div>

      <!-- =================================================
         GAME CARD
    ================================================== -->

      <div class="game-card">
        <!-- Question number -->

        <div class="question-top">
          <span id="questionNumber"> Question 1 / 10 </span>

          <span class="attempt-display">
            ❤️
            <span id="attempts">3</span>
          </span>
        </div>

        <!-- RIDDLE -->

        <div class="riddle-box">
          <div class="riddle-icon">🤔</div>

          <h2 id="question">Loading question...</h2>
        </div>

        <!-- =================================================
             CLUES
        ================================================== -->

        <div class="clue-area">
          <button id="clueButton" class="btn clue-button" onclick="useClue()">
            💡 Use a Clue
          </button>

          <div id="clueText" class="clue-text d-none"></div>
        </div>

        <!-- =================================================
             ANSWER INPUT
        ================================================== -->

        <div class="answer-area">
          <input
            type="text"
            id="answerInput"
            class="form-control answer-input"
            placeholder="Answer para mone..."
            autocomplete="off"
          />

          <button
            id="submitButton"
            class="btn submit-button"
            onclick="submitAnswer()"
          >
            Submit Answer →
          </button>
        </div>

        <!-- Feedback -->

        <div id="feedback"></div>
      </div>

      <!-- =================================================
         MEME POPUP
    ================================================== -->

      <div class="modal fade" id="memeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content meme-modal">
            <div class="modal-header">
              <h5 class="modal-title" id="memeTitle">💀 PANI PAALI</h5>

              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body text-center">
              <!-- =================================================
                         MEME IMAGE PLACEHOLDER

                         PUT YOUR MEME IMAGE HERE.

                         Example:

                         /assets/memes/failure.jpg

                    ================================================== -->

              <img
                id="memeImage"
                src=""
                alt="Malayalam Meme"
                class="meme-image d-none"
              />

              <!-- =================================================
                         MEME VIDEO PLACEHOLDER

                         PUT YOUR MOVIE MEME VIDEO HERE.

                         Example:

                         /assets/videos/failure.mp4

                    ================================================== -->

              <video id="memeVideo" class="meme-video d-none" controls>
                <source id="memeVideoSource" src="" />
              </video>

              <p id="memeMessage" class="meme-message"></p>

              <!-- =================================================
                         MEME AUDIO PLACEHOLDER

                         PUT YOUR AUDIO FILE HERE.

                         Example:

                         /assets/audio/failure.mp3

                    ================================================== -->

              <audio id="memeAudio" controls>
                <source id="memeAudioSource" src="" />
              </audio>
            </div>

            <div class="modal-footer">
              <button
                class="btn next-button"
                data-bs-dismiss="modal"
                onclick="nextQuestion()"
              >
                Next Question →
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- =====================================================
     BOOTSTRAP JS
===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Our JavaScript -->

    <script src="script.js"></script>
  </body>
</html>
